# cargo-audit policy for the Acc-Rust Tauri workspace.
#
# Every exception must name an owner, a reason and a review date. Remove an
# entry as soon as the lockfile no longer contains the affected version; the
# `deny-warnings` CI step fails if it finds an advisory that is not listed
# here, so a new warning cannot silently join the allowlist.
#
# Owner: release maintainer (see Docs/Data-Protection-and-Release-Policy.md)
# Review: 2027-02-01, or earlier when the dependency chain changes.

[advisories]
ignore = [
  # RUSTSEC-2024-0370: `proc-macro-error` is unmaintained. It is a build-time
  # dependency of the Tauri/GTK macro chain and is not shipped in the Windows
  # executable. Replace it when the upstream Tauri dependency graph does.
  "RUSTSEC-2024-0370",
  # RUSTSEC-2024-0429: unsound `glib` iterator impls. The affected crate is part
  # of the Linux/GTK build path; Windows builds use WebView2 and do not link it.
  # Tracking the Tauri/GTK upgrade that raises `glib` above 0.18.
  "RUSTSEC-2024-0429",
]

[package]
name = "hesabdari"
version = "5.0.0"
description = "نرم‌افزار حسابداری"
authors = ["Hesabdari"]
edition = "2021"
rust-version = "1.88"

[features]
default = []
# Local browser mode. The desktop build does not compile these dependencies.
web = ["dep:axum", "dep:tokio", "dep:tower-http"]

[lib]
name = "hesabdari_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hesabdari-web"
path = "src/bin/hesabdari-web.rs"
required-features = ["web"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
jalali-calendar = "0.1.2"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
calamine = "0.38"
rust_xlsxwriter = "0.102"
sha2 = "0.11.1"
hmac = "0.13.0"
getrandom = "0.3"
zip = { version = "9.2", default-features = false }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = "0.6.0"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
opt-level = 3

# Development builds (`run.bat` without arguments) compile dependencies, and
# with them the bundled C source of SQLite, with optimisation. Without this a
# debug build runs SQL about 2.5x slower than release, which made large
# reports look hung. Your own crate still builds fast in debug.
[profile.dev.package."*"]
opt-level = 3

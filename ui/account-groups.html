<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تعریف گروه حساب‌ها</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="account-groups.css" />
</head>
<body class="ag-page">
  <!-- ═══ Icon sprite (only the symbols used by this window) ═══════════════ -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-folder" viewBox="0 0 16 16">
      <path d="M1.6 4.2c0-.6.5-1.1 1.1-1.1h3.1l1.4 1.7h6c.6 0 1.1.5 1.1 1.1v6.3c0 .6-.5 1.1-1.1 1.1H2.7c-.6 0-1.1-.5-1.1-1.1z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-edit" viewBox="0 0 16 16">
      <path d="M10.6 2.4 13.6 5.4 5.8 13.2 2.4 13.6 2.8 10.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
      <path d="m9.4 3.6 3 3" fill="none" stroke="currentColor" stroke-width="1.1" />
    </symbol>
    <symbol id="i-plus" viewBox="0 0 16 16">
      <path d="M8 3.1v9.8M3.1 8h9.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 16 16">
      <path d="M2.8 4.3h10.4M6.2 2.3h3.6M4.2 4.3l.6 9.2c.1.6.5 1 1.1 1h4.2c.6 0 1-.4 1.1-1l.6-9.2M6.6 7v4.4M9.4 7v4.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-save" viewBox="0 0 16 16">
      <path d="M2.2 2.2h9.1l2.5 2.5v9.1H2.2z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" />
      <path d="M4.9 2.2v3.7h6V2.2M4.9 13.8V9.5h6.2v4.3" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-close" viewBox="0 0 16 16">
      <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    </symbol>
    <symbol id="i-alert" viewBox="0 0 16 16">
      <path d="M8 2.3 14.4 13.4H1.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M8 6.4v3.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="8" cy="11.6" r=".85" fill="currentColor" />
    </symbol>
    <symbol id="i-info" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2" />
      <circle cx="8" cy="5.2" r=".9" fill="currentColor" />
      <path d="M8 7.4v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
    </symbol>
    <symbol id="i-check" viewBox="0 0 16 16">
      <path d="M3.4 8.4 6.4 11.4 12.6 4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16">
      <path d="M6 3.6 10.4 8 6 12.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
  </svg>

  <main class="ag-shell" aria-labelledby="agPageTitle">
    <h1 class="ag-sr-title" id="agPageTitle">تعریف گروه حساب‌ها</h1>

    <div class="ag-content">
      <!-- ── Error bar ─────────────────────────────────────────────── -->
      <div class="ag-error" id="agError" role="alert" aria-live="assertive" hidden>
        <svg class="ico ag-error-ico" aria-hidden="true"><use href="#i-alert" /></svg>
        <span class="ag-error-text" id="agErrorText"></span>
        <button type="button" class="ag-error-close" id="agErrorClose" title="بستن پیام" aria-label="بستن پیام خطا">✕</button>
      </div>

      <!-- ── Account groups grid ───────────────────────────────────── -->
      <fieldset class="ag-fieldset ag-grid-fieldset">
        <legend class="ag-legend">
          <svg class="ico" aria-hidden="true"><use href="#i-folder" /></svg>
          گروه‌های حساب
          <span class="ag-legend-count" id="agGroupCount">—</span>
        </legend>

        <div class="ag-grid" role="grid" aria-label="فهرست گروه حساب‌ها" aria-colcount="4">
          <div class="ag-grid-head" role="row">
            <div class="ag-th ag-th-num" role="columnheader">ردیف</div>
            <div class="ag-th" role="columnheader">کد گروه</div>
            <div class="ag-th ag-th-name" role="columnheader">نام گروه حساب</div>
            <div class="ag-th" role="columnheader">نوع حساب</div>
          </div>
          <div class="ag-grid-body" id="agGridBody" role="rowgroup" aria-live="polite"></div>
        </div>
      </fieldset>

      <!-- ── Selected group details ────────────────────────────────── -->
      <fieldset class="ag-fieldset ag-form-fieldset">
        <legend class="ag-legend">
          <svg class="ico" aria-hidden="true"><use href="#i-edit" /></svg>
          مشخصات گروه
        </legend>

        <form id="agForm" class="ag-form" novalidate>
          <div class="ag-fields">
            <div class="ag-field ag-field-code">
              <label for="agCode">کد گروه <span class="ag-req">*</span></label>
              <input id="agCode" class="ag-input" type="text" dir="ltr" inputmode="numeric"
                     maxlength="50" autocomplete="off" spellcheck="false" aria-label="کد گروه" />
            </div>
            <div class="ag-field ag-field-name">
              <label for="agName">نام گروه <span class="ag-req">*</span></label>
              <input id="agName" class="ag-input" type="text" maxlength="255"
                     autocomplete="off" aria-label="نام گروه" />
            </div>
            <div class="ag-field ag-field-type">
              <label for="agType">نوع حساب</label>
              <div class="ag-select-wrap">
                <select id="agType" class="ag-input ag-select" aria-label="نوع حساب">
                  <option value="دارایی">دارایی</option>
                  <option value="بدهی">بدهی</option>
                  <option value="سرمایه">سرمایه</option>
                  <option value="درآمد">درآمد</option>
                  <option value="هزینه">هزینه</option>
                  <option value="سایر">سایر</option>
                </select>
                <svg class="ico ag-select-arrow" aria-hidden="true"><use href="#i-chevron" /></svg>
              </div>
            </div>
          </div>

          <div class="ag-form-foot">
            <span class="ag-hint" id="agHint">برای ویرایش، دکمه اصلاح را بزنید.</span>
            <span class="ag-chip" id="agAccountChip" hidden></span>
          </div>
        </form>
      </fieldset>
    </div>

    <!-- ── Dialog button panel / status bar ─────────────────────────── -->
    <footer class="ag-footer">
      <div class="ag-actions">
        <button type="button" class="ag-btn ag-btn-primary" id="agNew" title="تعریف گروه جدید">
          <svg class="ico" aria-hidden="true"><use href="#i-plus" /></svg>
          <span>جدید</span>
        </button>
        <button type="button" class="ag-btn" id="agEdit" title="اصلاح گروه انتخاب‌شده (F3)">
          <svg class="ico" aria-hidden="true"><use href="#i-edit" /></svg>
          <span>اصلاح</span>
        </button>
        <button type="button" class="ag-btn" id="agDelete" title="حذف گروه انتخاب‌شده (Delete)">
          <svg class="ico" aria-hidden="true"><use href="#i-trash" /></svg>
          <span>حذف</span>
        </button>
        <button type="button" class="ag-btn ag-btn-primary" id="agSave" title="ذخیره تغییرات (F2)" hidden>
          <svg class="ico" aria-hidden="true"><use href="#i-save" /></svg>
          <span id="agSaveLabel">ذخیره (F2)</span>
        </button>
        <button type="button" class="ag-btn" id="agCancel" title="انصراف از ویرایش (Esc)" hidden>
          <svg class="ico" aria-hidden="true"><use href="#i-close" /></svg>
          <span>انصراف</span>
        </button>
      </div>

      <div class="ag-status" id="agDbStatus" title="">
        <svg class="ico" aria-hidden="true"><use href="#i-info" /></svg>
        <span id="agDbText">SQLite</span>
      </div>
    </footer>
  </main>

  <!-- ── Confirmation dialog (inside this native window) ───────────── -->
  <div class="ag-modal" id="agConfirm" hidden>
    <div class="ag-confirm" id="agConfirmBox" role="alertdialog" aria-modal="true"
         aria-labelledby="agConfirmTitle" aria-describedby="agConfirmText" data-tone="warn">
      <div class="ag-confirm-icon" aria-hidden="true">!</div>
      <div class="ag-confirm-body">
        <h2 id="agConfirmTitle">تأیید</h2>
        <p id="agConfirmText"></p>
      </div>
      <div class="ag-confirm-actions">
        <button type="button" class="ag-btn ag-btn-danger" id="agConfirmYes">بله</button>
        <button type="button" class="ag-btn" id="agConfirmNo">خیر</button>
      </div>
    </div>
  </div>

  <div class="ag-toast" id="agToast" role="status" aria-live="polite" hidden></div>

  <script src="account-groups.js"></script>
</body>
</html>

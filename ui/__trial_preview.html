<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <div class="app accounting-app">
    <main class="workspace">
      <div class="page-scroll" id="page"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <input id="wallpaperPicker" type="file" accept="image/*" hidden />
  <div class="modal" id="modal" hidden><div class="dialog"><div class="dialog-head" id="dialogTitle"></div></div></div>

  <script>
    window.__IS_TRIAL_BALANCE_POPUP__ = true;
    const amount = (value) => String(value ?? 0);
    const trialRows = [
      { accountCode: '1101', accountName: 'دارایی‌های جاری', groupName: 'دارایی‌ها', parentCode: '', level: 1, openingDebit: amount(10000000), openingCredit: '0', periodDebit: amount(1500000), periodCredit: amount(400000), closingDebit: amount(11100000), closingCredit: '0' },
      { accountCode: '110101', accountName: 'صندوق', groupName: 'دارایی‌ها', parentCode: '1101', level: 2, openingDebit: amount(2000000), openingCredit: '0', periodDebit: amount(500000), periodCredit: amount(100000), closingDebit: amount(2400000), closingCredit: '0' },
      { accountCode: '110102', accountName: 'بانک ملت', groupName: 'دارایی‌ها', parentCode: '1101', level: 2, openingDebit: amount(8000000), openingCredit: '0', periodDebit: amount(1000000), periodCredit: amount(300000), closingDebit: amount(8700000), closingCredit: '0' },
      { accountCode: '1102', accountName: 'دارایی‌های ثابت', groupName: 'دارایی‌ها', parentCode: '', level: 1, openingDebit: amount(5000000), openingCredit: '0', periodDebit: '0', periodCredit: '0', closingDebit: amount(5000000), closingCredit: '0' },
      { accountCode: '110201', accountName: 'اموال، ماشین‌آلات و تجهیزات', groupName: 'دارایی‌ها', parentCode: '1102', level: 2, openingDebit: amount(5000000), openingCredit: '0', periodDebit: '0', periodCredit: '0', closingDebit: amount(5000000), closingCredit: '0' },
      { accountCode: '2101', accountName: 'بدهی‌های جاری', groupName: 'بدهی‌ها', parentCode: '', level: 1, openingDebit: '0', openingCredit: amount(4000000), periodDebit: amount(500000), periodCredit: amount(1000000), closingDebit: '0', closingCredit: amount(4500000) },
      { accountCode: '210101', accountName: 'حساب‌های پرداختنی', groupName: 'بدهی‌ها', parentCode: '2101', level: 2, openingDebit: '0', openingCredit: amount(4000000), periodDebit: amount(500000), periodCredit: amount(1000000), closingDebit: '0', closingCredit: amount(4500000) },
      { accountCode: '3101', accountName: 'سرمایه', groupName: 'سرمایه', parentCode: '', level: 1, openingDebit: '0', openingCredit: amount(11000000), periodDebit: '0', periodCredit: '0', closingDebit: '0', closingCredit: amount(11000000) },
      { accountCode: '4101', accountName: 'درآمد فروش', groupName: 'درآمدها', parentCode: '', level: 1, openingDebit: '0', openingCredit: '0', periodDebit: '0', periodCredit: amount(1600000), closingDebit: '0', closingCredit: amount(1600000) },
      { accountCode: '5101', accountName: 'هزینه اجاره', groupName: 'هزینه‌ها', parentCode: '', level: 1, openingDebit: '0', openingCredit: '0', periodDebit: amount(1000000), periodCredit: '0', closingDebit: amount(1000000), closingCredit: '0' },
    ];
    window.__TAURI__ = {
      core: {
        invoke: async (command) => {
          if (command === 'get_settings') {
            return { companyName: 'شرکت نمونه', fiscalYear: '1405', today: '1405/08/14', limits: {} };
          }
          if (command === 'get_trial_balance') {
            return {
              from: '1405/01/01',
              to: '1405/08/14',
              rows: trialRows,
              openingDebit: amount(15000000),
              openingCredit: amount(15000000),
              periodDebit: amount(3000000),
              periodCredit: amount(3000000),
              closingDebit: amount(17100000),
              closingCredit: amount(17100000),
            };
          }
          return {};
        },
      },
      window: {
        getCurrentWindow: () => ({ label: 'trial-balance', close: async () => {} }),
      },
      event: { listen: async () => () => {} },
    };
  </script>
  <script src="js/core.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/data.js"></script>
  <script src="js/pages-core.js"></script>
  <script src="js/bindings.js?v=20261105"></script>
  <script src="js/pages/vouchers.js"></script>
  <script src="js/pages/journal.js"></script>
  <script src="js/pages/ledger.js"></script>
  <script src="js/pages/trial-balance.js?v=20261105"></script>
  <script src="js/pages/income-statement.js"></script>
  <script src="js/pages/balance-sheet.js"></script>
  <script src="js/pages/accounts.js"></script>

  <script src="js/chrome.js"></script>
  <script src="js/init.js?v=20261105"></script>
  <script src="account-definition.js"></script>
  <script>
    const previewParams = new URLSearchParams(location.search);
    if (previewParams.has('drill')) {
      setTimeout(() => {
        document.querySelector('.tbp-data-row[data-code="1101"]')
          ?.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
      }, 700);
    }
  </script>
</body>

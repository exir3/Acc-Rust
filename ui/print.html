<!DOCTYPE html>
<html lang="fa" dir="rtl" class="pp-root">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پیش‌نمایش چاپ</title>
  <link rel="stylesheet" href="print-preview.css" />
</head>
<body>
  <div id="ppLoading" class="pp-state">
    <div class="pp-state-card">
      <div class="pp-spinner" aria-hidden="true"></div>
      <p>در حال آماده‌سازی پیش‌نمایش چاپ…</p>
    </div>
  </div>

  <div id="ppError" class="pp-state" hidden>
    <div class="pp-state-card">
      <p id="ppErrorText">گزارشی برای نمایش وجود ندارد.</p>
      <button type="button" class="pp-btn" id="ppErrorClose">بستن پنجره</button>
    </div>
  </div>

  <div id="ppToolbar" class="pp-toolbar">
    <div class="pp-identity">
      <svg class="pp-logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="7" fill="#0f6cbd" />
        <rect x="7.5" y="17" width="3.4" height="7.5" rx="1" fill="#ffd166" />
        <rect x="13" y="13" width="3.4" height="11.5" rx="1" fill="#ffd166" />
        <rect x="18.5" y="9" width="3.4" height="15.5" rx="1" fill="#ffd166" />
        <circle cx="12" cy="10.4" r="4.2" fill="none" stroke="#fff" stroke-width="2.1" />
        <line x1="15.2" y1="13.6" x2="18.6" y2="16.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
      </svg>
      <div class="pp-titles">
        <div class="pp-kicker">پیش‌نمایش چاپ</div>
        <div class="pp-title" id="ppTitle">در حال بارگذاری…</div>
        <div class="pp-subtitle" id="ppSubtitle"></div>
      </div>
    </div>

    <div class="pp-meta">
      <span class="pp-chip" id="ppPaper">A4</span>
      <span class="pp-chip" id="ppPages" hidden></span>
    </div>

    <div class="pp-actions">
      <div class="pp-zoom" role="group" aria-label="بزرگ‌نمایی پیش‌نمایش">
        <button type="button" id="ppZoomOut" title="کوچک‌تر (Ctrl+-)">−</button>
        <span id="ppZoomLabel">۱۰۰٪</span>
        <button type="button" id="ppZoomIn" title="بزرگ‌تر (Ctrl++)">+</button>
        <button type="button" id="ppZoomFit" title="تنظیم با عرض پنجره">تناسب</button>
      </div>
      <button type="button" class="pp-btn" id="ppSave" title="ذخیره نسخه HTML قابل چاپ">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 2.2h9.1l2.5 2.5v9.1H2.2z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" /><path d="M4.9 2.2v3.7h6V2.2M4.9 13.8V9.5h6.2v4.3" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" /></svg>
        ذخیره HTML
      </button>
      <button type="button" class="pp-btn pp-primary" id="ppPrint" title="چاپ یا ذخیره PDF (Ctrl+P)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.4 6.2V2.3h7.2v3.9" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" /><rect x="1.9" y="6" width="12.2" height="5.1" rx="1" fill="none" stroke="currentColor" stroke-width="1.25" /><path d="M4.4 9.6h7.2v4.1H4.4z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" /></svg>
        چاپ / PDF
      </button>
      <button type="button" class="pp-btn pp-ghost" id="ppClose" title="بستن (Esc)">بستن</button>
    </div>
  </div>

  <div id="ppStatus" class="pp-status" role="status">
    <span class="pp-status-dot"></span>
    <span id="ppStatusText">پیش‌نمایش آماده است.</span>
    <span class="pp-status-hint">صفحه‌بندی نهایی هنگام چاپ اعمال می‌شود.</span>
  </div>

  <script src="web-window.js"></script>
  <script src="web-bridge.js"></script>
  <script src="print-preview.js"></script>
</body>
</html>

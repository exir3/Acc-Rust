name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Fail when signing secrets are missing (official release)
        type: boolean
        default: false

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run frontend unit tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ui-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run UI end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  desktop-build:
    needs: [verify, ui-e2e, security-audit]
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      - name: Require signing for release builds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release && env.WINDOWS_CERTIFICATE_BASE64 == '' }}
        shell: pwsh
        run: throw "Release builds require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD."

      - name: Build Windows executable (no bundle)
        run: npx tauri build --no-bundle

      - name: Sign application executable (optional)
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $exe = "src-tauri/target/release/Hesabdari.exe"
          if (-not (Test-Path $exe)) { throw "The application executable was not produced." }
          $pfx = Join-Path $env:RUNNER_TEMP "acc-rust-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 $exe
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for the application executable." }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Bundle Windows installer (without binary patching)
        run: npx tauri bundle --bundles nsis --no-binary-patching

      - name: Sign Windows installer (optional)
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $pfx = Join-Path $env:RUNNER_TEMP "acc-rust-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
            if (-not $installers) { throw "No NSIS installer found to sign." }
            foreach ($installer in $installers) {
              & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.Name)." }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Windows signatures
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $exe = "src-tauri/target/release/Hesabdari.exe"
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) { throw "The application executable was not produced." }
          if (-not $installers) { throw "NSIS installer was not produced." }
          $targets = @($exe) + @($installers | ForEach-Object { $_.FullName })
          foreach ($target in $targets) {
            & $signtool verify /pa /v $target
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $target." }
          }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "NSIS installer was not produced." }
          $installer | ForEach-Object { Write-Host $_.FullName }

      - name: Record artifact hashes and signature metadata
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/Hesabdari.exe"
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) { throw "The application executable was not produced." }
          if (-not $installers) { throw "NSIS installer was not produced." }
          $signed = $env:WINDOWS_CERTIFICATE_BASE64 -ne ''
          $exeSignature = Get-AuthenticodeSignature $exe
          $certificate = if ($exeSignature.SignerCertificate) {
            [ordered]@{
              subject = $exeSignature.SignerCertificate.Subject
              thumbprint = $exeSignature.SignerCertificate.Thumbprint
              notAfter = $exeSignature.SignerCertificate.NotAfter.ToUniversalTime().ToString("o")
            }
          } else { $null }
          $artifacts = @()
          foreach ($file in (@($exe) + @($installers | ForEach-Object { $_.FullName }))) {
            $signature = Get-AuthenticodeSignature $file
            $artifacts += [ordered]@{
              name = (Split-Path $file -Leaf)
              path = $file
              sha256 = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              signatureStatus = $signature.Status.ToString()
            }
          }
          $metadata = [ordered]@{
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            signed = $signed
            certificate = $certificate
            artifacts = $artifacts
          }
          $metadata | ConvertTo-Json -Depth 6 | Set-Content -Path "release-metadata.json" -Encoding utf8
          Get-Content "release-metadata.json"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ env.WINDOWS_CERTIFICATE_BASE64 != '' && 'signed' || 'unsigned' }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release-metadata.json
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Fail when signing secrets are missing (official release)
        type: boolean
        default: false

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Run frontend unit tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ui-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run UI end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      - name: Audit npm dependencies
        # moderate catches prototype-pollution and ReDoS advisories that a
        # "high" threshold silently skips; the lockfile currently reports none.
        run: npm audit --audit-level=moderate

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        # The only accepted advisories are documented in src-tauri/.cargo/audit.toml.
        run: cargo audit --deny warnings

  desktop-build:
    needs: [verify, ui-e2e, security-audit]
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend tooling
        run: npm ci --no-audit --no-fund

      # Tauri downloads the NSIS toolset from GitHub release assets on the
      # first bundle. Caching it both speeds the job up and avoids depending
      # on that download on every run. The key follows the lockfile so a Tauri
      # CLI upgrade starts from a clean cache.
      - name: Cache Tauri bundler tools
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ hashFiles('package-lock.json') }}

      - name: Require signing for release builds
        if: ${{ env.RELEASE_BUILD == 'true' && (env.WINDOWS_CERTIFICATE_BASE64 == '' || env.WINDOWS_CERTIFICATE_PASSWORD == '') }}
        shell: pwsh
        run: throw "Release builds require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD."

      - name: Require independent accounting report sign-off for release builds
        if: ${{ env.RELEASE_BUILD == 'true' }}
        shell: pwsh
        # Fails unless Docs/Accounting-Report-Signoff.md is approved, names the
        # reviewer and date, and pins the current report_reference.json hash.
        run: node scripts/check-report-signoff.mjs

      - name: Build Windows executable (no bundle)
        run: npx tauri build --no-bundle

      - name: Build debug executable for smoke test
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Smoke test real Windows/Tauri/WebView2 app
        run: node scripts/smoke-windows.mjs --exe src-tauri/target/debug/Hesabdari.exe

      - name: Sign application executable (optional)
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $exe = "src-tauri/target/release/Hesabdari.exe"
          if (-not (Test-Path $exe)) { throw "The application executable was not produced." }
          $pfx = Join-Path $env:RUNNER_TEMP "acc-rust-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 $exe
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for the application executable." }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Bundle Windows installer (without binary patching)
        shell: pwsh
        # The bundler downloads NSIS with a single attempt and fails the job on
        # any HTTP error. GitHub's release-asset CDN returned 504 twice on
        # 2026-11-08 (once for nsis-3.13.zip, once for nsis_tauri_utils.dll),
        # so retry the already-built bundle. A failed attempt can leave a
        # partially extracted toolset; the bundler detects and recreates it.
        run: |
          $attempts = 4
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            npx tauri bundle --bundles nsis --no-binary-patching
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $attempts) {
              throw "Bundling failed after $attempts attempts (exit code $LASTEXITCODE)."
            }
            $delay = 15 * $attempt
            Write-Warning "Bundling attempt $attempt failed; retrying in $delay seconds."
            Start-Sleep -Seconds $delay
          }

      - name: Sign Windows installer (optional)
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          $pfx = Join-Path $env:RUNNER_TEMP "acc-rust-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
            if (-not $installers) { throw "No NSIS installer found to sign." }
            foreach ($installer in $installers) {
              & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.Name)." }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/Hesabdari.exe"
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) { throw "The application executable was not produced." }
          if (-not $installers) { throw "NSIS installer was not produced." }
          $targets = @($exe) + @($installers | ForEach-Object { $_.FullName })

          if ($env:WINDOWS_CERTIFICATE_BASE64 -ne '') {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe was not found." }
            foreach ($target in $targets) {
              & $signtool verify /pa /v $target
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $target." }
            }
          }

          $invalid = @()
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            Write-Host "$target -> $($signature.Status)"
            if ($signature.Status -ne 'Valid') { $invalid += $target }
          }
          if ($env:RELEASE_BUILD -eq 'true' -and $invalid.Count -gt 0) {
            throw "Every official release artifact must have a valid Authenticode signature. Invalid: $($invalid -join ', ')"
          }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "NSIS installer was not produced." }
          $installer | ForEach-Object { Write-Host $_.FullName }

      - name: Record artifact hashes and signature metadata
        id: metadata
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/Hesabdari.exe"
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) { throw "The application executable was not produced." }
          if (-not $installers) { throw "NSIS installer was not produced." }
          $artifacts = @()
          foreach ($file in (@($exe) + @($installers | ForEach-Object { $_.FullName }))) {
            $signature = Get-AuthenticodeSignature $file
            $artifacts += [ordered]@{
              name = (Split-Path $file -Leaf)
              path = $file
              sha256 = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              signatureStatus = $signature.Status.ToString()
            }
          }
          $signed = @($artifacts | Where-Object { $_.signatureStatus -ne 'Valid' }).Count -eq 0
          # A plain-text checksum manifest so a user can verify a download with
          # `certutil -hashfile` or `sha256sum -c` without opening the JSON.
          $artifacts | ForEach-Object { "$($_.sha256)  $($_.name)" } |
            Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          $releaseBuild = $env:RELEASE_BUILD -eq 'true'
          if ($releaseBuild -and -not $signed) {
            throw "Every official release artifact must have a valid Authenticode signature."
          }
          $exeSignature = Get-AuthenticodeSignature $exe
          $certificate = if ($exeSignature.SignerCertificate) {
            [ordered]@{
              subject = $exeSignature.SignerCertificate.Subject
              thumbprint = $exeSignature.SignerCertificate.Thumbprint
              notAfter = $exeSignature.SignerCertificate.NotAfter.ToUniversalTime().ToString("o")
            }
          } else { $null }
          $metadata = [ordered]@{
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            releaseBuild = $releaseBuild
            signed = $signed
            certificate = $certificate
            artifacts = $artifacts
          }
          $metadata | ConvertTo-Json -Depth 6 | Set-Content -Path "release-metadata.json" -Encoding utf8
          Get-Content "release-metadata.json"
          "release=$($releaseBuild.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ steps.metadata.outputs.release == 'true' && 'release' || 'build' }}-${{ steps.metadata.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: |
            src-tauri/target/release/Hesabdari.exe
            src-tauri/target/release/bundle/nsis/*.exe
            release-metadata.json
            SHA256SUMS.txt
          if-no-files-found: error
